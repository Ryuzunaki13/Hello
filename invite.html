<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invite</title>
  <style>
    :root{
      --bg:#fff6f8;
      --card:#ffffff;
      --accent:#d95d7a;
      --accent-2:#e14f74;
      --muted:#7b5a63;
      --radius:14px;
      --shadow: 0 12px 30px rgba(11,12,15,0.06);
      --option-shadow: 0 8px 20px rgba(17,15,17,0.04);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);-webkit-font-smoothing:antialiased;color:#3a2a2f}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .stage{width:100%;max-width:760px;padding:0;border-radius:var(--radius);text-align:center}
    .question-box{
      margin:0 auto 18px;max-width:640px;padding:18px;border-radius:12px;background:var(--card);
      box-shadow:var(--shadow);border:1px solid rgba(17,15,17,0.03);
    }
    .question{font-family:Georgia,serif;font-size:20px;margin:0;color:#3a1f2b}
    /* each option is its own card */
    .options-grid{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
      max-width:820px;
      margin:0 auto;
      padding:6px;
    }
    /* special layout when free step - force two side-by-side layout */
    .options-grid.free{
      flex-wrap:nowrap;
      gap:20px;
      align-items:center;
    }
    .option-card{
      background:var(--card);
      min-width:220px;
      max-width:320px;
      width:100%;
      padding:18px 20px;
      border-radius:14px;
      box-shadow:var(--option-shadow);
      border:1px solid rgba(17,15,17,0.03);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .12s ease,box-shadow .12s;
      user-select:none;
    }
    .option-card:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(17,15,17,0.06)}
    .option-label{font-weight:700;color:#3a1f2b}
    .option-card.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:white}
    .option-card.primary .option-label{color:white}
    .option-card:focus{outline:3px solid rgba(217,93,122,0.12);outline-offset:4px}
    .spacer{height:10px}
    .progress{display:flex;gap:8px;justify-content:center;margin-top:18px}
    .dot{width:9px;height:9px;border-radius:9px;background:rgba(225,79,116,0.08)}
    .dot.active{background:var(--accent);box-shadow:0 6px 18px rgba(225,79,116,0.08)}
    @media (max-width:760px){
      /* keep times stacked on small screens, but keep free step side-by-side */
      .options-grid:not(.free){flex-direction:column;padding:0 18px}
      .option-card{max-width:none}
      .question-box{margin:0 18px 14px}
    }
    @media (max-width:420px){
      /* when space is tight, allow the free step to have two compact cards */
      .options-grid.free{gap:10px}
      .options-grid.free .option-card{flex:0 1 46%; min-width:120px}
    }
    .option-card:active{transform:translateY(1px)}
    .option-card[aria-pressed="true"]{box-shadow:0 20px 40px rgba(17,15,17,0.08)}
  </style>
</head>
<body>
  <main class="wrap" aria-live="polite">
    <section class="stage" role="main" aria-label="RSVP">
      <div class="question-box" id="questionBox">
        <div id="question" class="question">Are you free?</div>
      </div>

      <div class="options-grid" id="optionsGrid" role="list">
        <!-- option cards injected here -->
      </div>

      <div class="progress" id="progress" aria-hidden></div>
    </section>
  </main>

  <script>
    // organiser address (change if needed)
    const ORGANISER = 'rafaelllaban1@gmail.com';

    const questionEl = document.getElementById('question');
    const optionsGrid = document.getElementById('optionsGrid');
    const progress = document.getElementById('progress');

    const steps = ['free','times'];
    let stepIndex = 0;

    function renderProgress(){
      progress.innerHTML = steps.map((_,i)=>`<div class="dot ${i===stepIndex? 'active':''}"></div>`).join('');
    }

    // helper to create an option card element
    function makeOptionCard({id, label, primary=false, dataset={}}){
      const el = document.createElement('div');
      el.className = 'option-card' + (primary? ' primary':'');
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('data-id', id);
      el.innerHTML = `<div class="option-label">${label}</div>`;
      Object.keys(dataset).forEach(k => el.dataset[k] = dataset[k]);
      return el;
    }

    // Step: Are you free? (two option cards side-by-side)
    function showFree(){
      stepIndex = 0;
      renderProgress();
      questionEl.textContent = 'Are you free?';
      optionsGrid.classList.add('free');
      optionsGrid.innerHTML = '';
      const yesCard = makeOptionCard({ id:'yes', label:'Yes', primary:true, dataset:{action:'yes'} });
      const noCard  = makeOptionCard({ id:'no',  label:'No',  primary:false, dataset:{action:'no'} });
      optionsGrid.appendChild(yesCard);
      optionsGrid.appendChild(noCard);
      focusFirstOption();
    }

    // Step: times (Yes) — stacked / grid of cards
    function showTimes(){
      stepIndex = 1;
      renderProgress();
      questionEl.textContent = 'Which time?';
      optionsGrid.classList.remove('free');
      optionsGrid.innerHTML = '';
      const times = [
        { id:'t1', label:'Friday, 7:00 PM', time: 'Friday, 7:00 PM' },
        { id:'t2', label:'Saturday, 3:00 PM', time: 'Saturday, 3:00 PM' },
        { id:'t3', label:'Sunday, 11:00 AM', time: 'Sunday, 11:00 AM' }
      ];
      times.forEach((t,i) => {
        const c = makeOptionCard({ id: t.id, label: t.label, primary: i===0, dataset:{action:'time', time: t.time} });
        optionsGrid.appendChild(c);
      });
      focusFirstOption();
    }

    // send functions
    function sendNo(){
      const body = [
        'Availability: No',
        'Sent at: ' + new Date().toLocaleString()
      ].join('\n');
      const subject = 'Invitation response: No';
      location.href = `mailto:${encodeURIComponent(ORGANISER)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function sendYes(time){
      const body = [
        'Availability: Yes',
        'Chosen time: ' + time,
        'Sent at: ' + new Date().toLocaleString()
      ].join('\n');
      const subject = 'Invitation response: Yes';
      location.href = `mailto:${encodeURIComponent(ORGANISER)}?subject=${encodeURIComponent(subject + ' — ' + time)}&body=${encodeURIComponent(body)}`;
    }

    // initial render
    showFree();

    // click delegation on grid (handles option-card clicks)
    optionsGrid.addEventListener('click', (e) => {
      const card = e.target.closest('.option-card');
      if(!card) return;
      const action = card.dataset.action;
      if(action === 'yes') showTimes();
      else if(action === 'no') sendNo();
      else if(action === 'time') sendYes(card.dataset.time);
    });

    // keyboard handling for Enter/Space on focused option-card and Esc to restart
    optionsGrid.addEventListener('keydown', (e) => {
      const focused = document.activeElement;
      if(!focused || !focused.classList.contains('option-card')) return;
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        focused.click();
      }
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') showFree();
    });

    function focusFirstOption(){
      setTimeout(() => {
        const first = optionsGrid.querySelector('.option-card');
        if(first) first.focus();
      }, 40);
    }
  </script>
</body>
</html>
