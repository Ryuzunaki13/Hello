<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quick RSVP</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Arial;background:#fff;color:#0b1220}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center}
    .card{width:100%;max-width:480px;padding:28px;border-radius:12px;border:1px solid #eef2f8;box-shadow:0 6px 20px rgba(16,24,40,.04);text-align:center}
    h1{font-size:20px;margin:0 0 18px}
    .actions{display:flex;gap:12px;justify-content:center}
    button{flex:1;padding:12px 14px;border-radius:10px;border:0;background:#0b78ff;color:#fff;font-weight:700;cursor:pointer}
    button.alt{background:#f3f6fb;color:#0b78ff;border:1px solid #e6eefc}
    input[type=text], textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eefc;margin-top:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card" id="card" role="region" aria-live="polite">
      <!-- Step UI injected by JS -->
    </div>
  </main>

  <script>
    // Single organiser
    const ORGANISER = 'rafaelllaban1@gmail.com';

    // Steps: each step is an object { id, render(state) }
    const steps = [];
    const state = { choice: null, customTime: '', place: '', message: '' };

    // Helper: render card content
    const card = document.getElementById('card');
    function render(html){ card.innerHTML = html }

    // Move to next step by id
    function showStep(id){ const s = steps.find(x=>x.id===id); if(s) render(s.render(state)); }

    // Step 1: Are you free?
    steps.push({ id: 'q-free', render: ()=> `
      <h1>Are you free?</h1>
      <div class="actions">
        <button id="yes">Yes</button>
        <button id="no" class="alt">No</button>
      </div>
    `});

    // Step 2 (yes): Which option?
    steps.push({ id: 'q-option', render: ()=> `
      <h1>Which option?</h1>
      <div class="actions">
        <button id="opt1">Friday 7pm</button>
        <button id="opt2" class="alt">Saturday 3pm</button>
      </div>
      <div style="height:12px"></div>
      <div class="actions">
        <button id="opt3">Sunday 11am</button>
        <button id="optCustom" class="alt">Custom</button>
      </div>
    `});

    // Step 3 (yes): Where?
    steps.push({ id: 'q-place', render: ()=> `
      <h1>Where can we meet?</h1>
      <input id="place" type="text" placeholder="Address or place" />
      <div style="height:12px"></div>
      <div class="actions">
        <button id="sendYes">Send</button>
        <button id="backPlace" class="alt">Back</button>
      </div>
    `});

    // Step custom time input
    steps.push({ id: 'q-custom', render: ()=> `
      <h1>Enter custom time</h1>
      <input id="custom" type="text" placeholder="e.g. Thursday, 6:15 PM" />
      <div style="height:12px"></div>
      <div class="actions">
        <button id="nextFromCustom">Next</button>
        <button id="backCustom" class="alt">Back</button>
      </div>
    `});

    // Step 2 (no): Message?
    steps.push({ id: 'q-no', render: ()=> `
      <h1>Leave a short message (optional)</h1>
      <textarea id="msg" placeholder="Sorry, not available..." rows="4"></textarea>
      <div style="height:12px"></div>
      <div class="actions">
        <button id="sendNo">Send</button>
        <button id="backNo" class="alt">Back</button>
      </div>
    `});

    // Initial render
    showStep('q-free');

    // Delegate clicks
    card.addEventListener('click', (e)=>{
      if(e.target.matches('#yes')){ showStep('q-option'); }
      if(e.target.matches('#no')){ showStep('q-no'); }

      if(e.target.matches('#opt1')){ state.choice = 'Friday, 7:00 PM'; showStep('q-place'); }
      if(e.target.matches('#opt2')){ state.choice = 'Saturday, 3:00 PM'; showStep('q-place'); }
      if(e.target.matches('#opt3')){ state.choice = 'Sunday, 11:00 AM'; showStep('q-place'); }
      if(e.target.matches('#optCustom')){ showStep('q-custom'); }

      if(e.target.matches('#backPlace')){ showStep('q-option'); }
      if(e.target.matches('#backCustom')){ showStep('q-option'); }
      if(e.target.matches('#backNo')){ showStep('q-free'); }

      if(e.target.matches('#nextFromCustom')){
        const val = document.getElementById('custom').value.trim();
        if(!val){ alert('Please enter a time'); return }
        state.choice = val;
        showStep('q-place');
      }

      if(e.target.matches('#sendYes')){
        const place = document.getElementById('place').value.trim();
        if(!place){ alert('Please enter where to meet'); return }
        state.place = place;
        const body = [`Availability: Yes`,`Chosen time: ${state.choice}`,`Where: ${state.place}`,`Sent at: ${new Date().toLocaleString()}`,`User agent: ${navigator.userAgent}`].join('\n');
        const mailto = `mailto:${encodeURIComponent(ORGANISER)}?subject=${encodeURIComponent('Invitation response: Yes')}&body=${encodeURIComponent(body)}`;
        window.location.href = mailto;
      }

      if(e.target.matches('#sendNo')){
        const msg = document.getElementById('msg').value.trim();
        state.message = msg;
        const body = [`Availability: No`, msg ? `Message: ${msg}` : '', `Sent at: ${new Date().toLocaleString()}`, `User agent: ${navigator.userAgent}`].filter(Boolean).join('\n');
        const mailto = `mailto:${encodeURIComponent(ORGANISER)}?subject=${encodeURIComponent('Invitation response: No')}&body=${encodeURIComponent(body)}`;
        window.location.href = mailto;
      }
    });

    // handle Enter key for inputs
    card.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        if(e.target.id === 'place') document.getElementById('sendYes')?.click();
        if(e.target.id === 'custom') document.getElementById('nextFromCustom')?.click();
        if(e.target.id === 'msg') document.getElementById('sendNo')?.click();
      }
    });
  </script>
</body>
</html>
