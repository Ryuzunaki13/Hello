<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick RSVP</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#ffffff;color:#0b1220}
    .wrap{max-width:520px;margin:6vh auto;padding:28px;border-radius:12px;border:1px solid #eef2f7;box-shadow:0 6px 20px rgba(16,24,40,.04)}
    h1{font-size:20px;margin:0 0 8px}
    p{margin:0 0 16px;color:#445}
    .controls{display:flex;gap:12px}
    button{flex:1;padding:10px 12px;border-radius:8px;border:0;background:#0b78ff;color:#fff;font-weight:600;cursor:pointer}
    button.ghost{background:#f3f6fb;color:#0b78ff;border:1px solid #e6eefc}
    .hidden{display:none}
    label{display:block;margin-bottom:10px}
    input[type=text], textarea{width:100%;padding:10px;border:1px solid #e6eefc;border-radius:8px;font-size:14px}
    .radio-row{display:flex;gap:8px;margin-bottom:10px}
    .radio-row label{flex:1;padding:10px;border-radius:8px;border:1px solid #eef4ff;background:#fbfdff;text-align:center;cursor:pointer}
    .small{font-size:13px;color:#667085;margin-top:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Are you free?</h1>
    <p>Quick reply — your response will be prepared for emailing to the organiser.</p>

    <div id="step1" aria-live="polite">
      <div class="controls">
        <button id="yesBtn">Yes</button>
        <button id="noBtn" class="ghost">No</button>
      </div>
    </div>

    <form id="yesForm" class="hidden" onsubmit="return false;" aria-live="polite">
      <div style="margin-top:14px">
        <div class="radio-row" role="radiogroup" aria-label="Choose time">
          <label><input type="radio" name="time" value="Friday, 7:00 PM" checked style="display:none"/>Friday, 7:00 PM</label>
          <label><input type="radio" name="time" value="Saturday, 3:00 PM" style="display:none"/>Saturday, 3:00 PM</label>
          <label><input type="radio" name="time" value="Sunday, 11:00 AM" style="display:none"/>Sunday, 11:00 AM</label>
        </div>
        <label>
          Where can we meet? (required)
          <input id="meet" type="text" placeholder="e.g. Cafe Mocha, 123 Main St" required />
        </label>
      </div>

      <div class="controls" style="margin-top:8px">
        <button id="sendYes">Send</button>
        <button id="backYes" class="ghost">Back</button>
      </div>
      <div class="small">The reply will open your mail client to send to a single address.</div>
    </form>

    <form id="noForm" class="hidden" onsubmit="return false;" aria-live="polite">
      <label style="margin-top:12px">
        Optional message
        <textarea id="noMsg" placeholder="Sorry, not available — maybe another time." rows="3"></textarea>
      </label>
      <div class="controls">
        <button id="sendNo">Send</button>
        <button id="backNo" class="ghost">Back</button>
      </div>
      <div class="small">The reply will open your mail client to send to a single address.</div>
    </form>

  </main>

  <script>
    // Single organiser email (hardcoded as requested)
    const ORGANISER = 'rafaelllaban1@gmail.com';

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const step1 = document.getElementById('step1');
    const yesForm = document.getElementById('yesForm');
    const noForm = document.getElementById('noForm');
    const backYes = document.getElementById('backYes');
    const backNo = document.getElementById('backNo');
    const sendYes = document.getElementById('sendYes');
    const sendNo = document.getElementById('sendNo');

    function show(el){ step1.classList.add('hidden'); yesForm.classList.add('hidden'); noForm.classList.add('hidden'); el.classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}) }
    function showStart(){ step1.classList.remove('hidden'); yesForm.classList.add('hidden'); noForm.classList.add('hidden'); window.scrollTo({top:0,behavior:'smooth'}) }

    yesBtn.addEventListener('click', ()=> show(yesForm));
    noBtn.addEventListener('click', ()=> show(noForm));
    backYes.addEventListener('click', showStart);
    backNo.addEventListener('click', showStart);

    function pickTime(){ const r = document.querySelector('input[name="time"]:checked'); return r ? r.value : '' }

    sendYes.addEventListener('click', ()=>{
      const time = pickTime();
      const meet = document.getElementById('meet').value.trim();
      if(!meet){ alert('Please enter where we can meet.'); document.getElementById('meet').focus(); return }
      const body = [];
      body.push('Availability: Yes');
      body.push('Chosen time: ' + time);
      body.push('Where: ' + meet);
      body.push('Sent at: ' + new Date().toISOString());
      body.push('User agent: ' + navigator.userAgent);
      const subject = 'Invitation response: Yes';
      const mailto = `mailto:${encodeURIComponent(ORGANISER)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.join('\n'))}`;
      window.location.href = mailto;
    });

    sendNo.addEventListener('click', ()=>{
      const msg = document.getElementById('noMsg').value.trim();
      const body = [];
      body.push('Availability: No');
      if(msg) body.push('\nMessage:\n' + msg);
      body.push('Sent at: ' + new Date().toISOString());
      body.push('User agent: ' + navigator.userAgent);
      const subject = 'Invitation response: No';
      const mailto = `mailto:${encodeURIComponent(ORGANISER)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.join('\n'))}`;
      window.location.href = mailto;
    });

    // Allow keyboard Enter on main buttons
    [yesBtn, noBtn].forEach(b=> b.addEventListener('keyup', e=> { if(e.key === 'Enter') b.click() }))
  </script>
</body>
</html>
